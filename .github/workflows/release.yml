name: Release

# Push a tag like v0.1.0 (it must match `version` in build.gradle) to publish a release
# with dopajshell.jar attached. The latest jar is always at
# https://github.com/<owner>/dopajshell/releases/latest/download/dopajshell.jar
# Afterwards the Scoop (bucket/) and Homebrew (Formula/) manifests on main are updated
# with the new version and SHA-256.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check that the tag matches build.gradle
        run: |
          v=$(sed -n "s/^version = '\(.*\)'/\1/p" build.gradle)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match build.gradle version $v"
            exit 1
          fi
      - run: ./gradlew test fatJar
      - run: cp build/libs/dopajshell-all.jar dopajshell.jar
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dopajshell.jar --title "$GITHUB_REF_NAME" --generate-notes
      - name: Update the Scoop and Homebrew manifests on main
        run: |
          sha=$(sha256sum dopajshell.jar | cut -d' ' -f1)
          git fetch origin main
          git checkout -B main origin/main
          sh packaging/update-manifests.sh "${GITHUB_REF_NAME#v}" "$sha"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket Formula
          git diff --cached --quiet || git commit -m "Update Scoop and Homebrew manifests for $GITHUB_REF_NAME"
          git push origin main
