name: Release

# Push a tag like v0.1.0 (it must match `version` in build.gradle) to publish a release
# with dopajshell.jar attached. The latest jar is always at
# https://github.com/<owner>/dopajshell/releases/latest/download/dopajshell.jar
# Afterwards the Scoop (bucket/) and Homebrew (Formula/) manifests on main are updated
# with the new version and SHA-256.
#
# Supply chain: actions are pinned to commit SHAs (Dependabot bumps them), the build
# does not use the Gradle cache, and the jar gets a build provenance attestation:
#   gh attestation verify dopajshell.jar --repo Shion-Serizawa/dopajshell
#
# main requires pull requests; only the deploy key in the `release` environment (usable
# from v* tags only) may push the manifest update. That job runs no build code, so a
# compromised dependency or build script never sees the key.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write
    outputs:
      sha256: ${{ steps.jar.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: corretto
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
          cache-disabled: true  # never build a release from a cache another run could have written
      - name: Check that the tag matches build.gradle
        run: |
          v=$(sed -n "s/^version = '\(.*\)'/\1/p" build.gradle)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match build.gradle version $v"
            exit 1
          fi
      - run: ./gradlew test fatJar
      - id: jar
        run: |
          cp build/libs/dopajshell-all.jar dopajshell.jar
          echo "sha256=$(sha256sum dopajshell.jar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dopajshell.jar
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Draft first, then publish: releases are immutable once published.
        run: |
          gh release create "$GITHUB_REF_NAME" dopajshell.jar --draft --title "$GITHUB_REF_NAME" --generate-notes
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

  manifests:
    needs: release
    runs-on: ubuntu-latest
    environment: release   # holds MANIFEST_DEPLOY_KEY; only v* tags may deploy to it
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          ssh-key: ${{ secrets.MANIFEST_DEPLOY_KEY }}
      - name: Update the Scoop and Homebrew manifests on main
        env:
          SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          sh packaging/update-manifests.sh "${GITHUB_REF_NAME#v}" "$SHA256"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket Formula
          git diff --cached --quiet || git commit -m "Update Scoop and Homebrew manifests for $GITHUB_REF_NAME"
          git push origin main
