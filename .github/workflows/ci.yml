name: CI

# Actions are pinned to commit SHAs; Dependabot keeps them (and the comments) up to date.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: corretto
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true  # fail if gradle-wrapper.jar is not an official Gradle build
      - run: ./gradlew test fatJar
      - name: Smoke test (bare java -jar, non-interactive)
        shell: bash
        run: |
          java -jar build/libs/dopajshell-all.jar --version
          out=$(echo 'IntStream.rangeClosed(1, 100).sum()' | java -jar build/libs/dopajshell-all.jar)
          echo "$out"
          echo "$out" | grep -q '5050'
