name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test fatJar
      - name: Smoke test (bare java -jar, non-interactive)
        shell: bash
        run: |
          java -jar build/libs/dopajshell-all.jar --version
          out=$(echo 'IntStream.rangeClosed(1, 100).sum()' | java -jar build/libs/dopajshell-all.jar)
          echo "$out"
          echo "$out" | grep -q '5050'
